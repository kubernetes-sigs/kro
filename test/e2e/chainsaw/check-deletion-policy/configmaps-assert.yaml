apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-retained
  namespace: default
  labels:
    app: demo
    kro.run/owned: "true"
  annotations:
    # The policy has to reach the object: the deletion path reads it from here,
    # not from the RGD.
    kro.run/deletion-policy: Detach
data:
  kind: retained
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-removed
  namespace: default
  labels:
    kro.run/owned: "true"
data:
  kind: removed
