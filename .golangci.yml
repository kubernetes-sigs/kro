version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: pkg/*
      # Test files legitimately repeat fixture strings, use long table rows,
      # and take fixed helper arguments — these linters are noise there.
      # Same reasoning for the fixture generators under test/integration and
      # the test-support scaffolding under pkg/testutil — they're test-suite
      # scaffolding, just not named _test.go.
      - linters:
          - lll
          - dupl
          - unparam
          - gocyclo
        path: (_test\.go|^test/integration/.*\.go|^pkg/testutil/.*\.go)$
      # Pre-existing staticcheck findings deferred to a dedicated cleanup PR
      # (tracked in docs/pr-1355-open-todos.md). SA1019 deprecated-API
      # migrations (scheme.Builder, client.Apply→SSA ApplyConfiguration,
      # GetEventRecorderFor, sets.String, FieldsV1.Raw) change behavior/ripple
      # through generated scaffolding, and two exported-symbol renames (ST1003:
      # V1ApplySetIdFormat, ApiExtensionsClient) ripple across consumers — both
      # are out of scope here. staticcheck is otherwise fully enabled (it was
      # previously disabled entirely via checks: [-QF1008]); the follow-up PR
      # does the SA1019 migration and drops these exclusions.
      - linters:
          - staticcheck
        text: "SA1019"
      - linters:
          - staticcheck
        text: "ST1003"
        path: (pkg/controller/instance/applyset/const\.go|pkg/client/fake/fake\.go)
      # ST1000 (missing package comment) is pervasive pre-existing doc debt
      # across ~36 packages repo-wide, unrelated to this PR. Deferred to the
      # same follow-up cleanup PR (tracked in docs/pr-1355-open-todos.md);
      # excluding it as a class avoids touching 36 unrelated packages here.
      - linters:
          - staticcheck
        text: "ST1000"
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    goconst:
      # Ignore protocol/schema vocabulary that recurs by nature — Kubernetes
      # object field keys and JSON-Schema type names. Deduping these into named
      # constants adds no clarity.
      ignore-string-values:
        - "true"
        - "false"
        - "apiVersion"
        - "kind"
        - "metadata"
        - "name"
        - "namespace"
        - "spec"
        - "status"
        - "conditions"
        - "labels"
        - "annotations"
        - "object"
        - "string"
        - "integer"
        - "number"
        - "boolean"
        - "array"
        - "map"
        - "bool"
        - "int"
    staticcheck:
      checks:
        - all
        - -QF1008
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: ["github.com/kubernetes-sigs/kro"]
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
