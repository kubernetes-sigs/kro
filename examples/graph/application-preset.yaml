# Generate ApplicationPreset's spec from the Quick Start RGD, my-application.
# Enable GraphKind. In the Graph's namespace, api-publisher needs get, list, and
# watch on RGDs and CRDs, plus create, patch, and delete on the target CRD.
# The list and watch grants must be cluster-wide, without resourceNames, so the
# Graph can react to changes. Deleting the Graph removes the CRD and its instances.
apiVersion: kro.run/v1alpha1
kind: Graph
metadata:
  name: application-preset-api
spec:
  serviceAccountName: api-publisher
  nodes:
    - id: application
      ref:
        apiVersion: kro.run/v1alpha1
        kind: ResourceGraphDefinition
        metadata:
          name: my-application
    - id: presets
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: applicationpresets.example.com
        spec:
          group: example.com
          scope: Namespaced
          names:
            kind: ApplicationPreset
            plural: applicationpresets
          versions:
            - name: v1
              served: true
              storage: true
              schema:
                openAPIV3Schema:
                  type: object
                  properties:
                    spec: >-
                      ${simpleschema.toOpenAPI(application.spec.schema.?spec.orValue(dyn({})), application.spec.schema.?types.orValue(dyn({})))}
