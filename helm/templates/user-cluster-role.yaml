apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    kubernetes.io/description: |
      This ClusterRole grants read/write access to kro resources by aggregating into the admin and edit ClusterRoles.
  name: {{ include "kro.fullname" . }}-edit
  labels:
    {{- include "kro.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - kro.run
  # Graph is an advanced, privileged primitive that must NOT be grantable through the
  # built-in edit/admin/view roles (it is gated behind the GraphKind feature and needs
  # an explicit, separate role). Therefore, enumerate resources explicitly and omit graphs.
  resources:
  - resourcegraphdefinitions
  - resourcegraphdefinitions/status
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    kubernetes.io/description: |
      This ClusterRole grants read access to kro resources by aggregating into the view, edit, and admin ClusterRoles.
  name: {{ include "kro.fullname" . }}-view
  labels:
    {{- include "kro.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups:
  - kro.run
  # Graph is an advanced, privileged primitive that must NOT be grantable through the
  # built-in edit/admin/view roles (it is gated behind the GraphKind feature and needs
  # an explicit, separate role). Therefore, enumerate resources explicitly and omit graphs.
  resources:
  - resourcegraphdefinitions
  - resourcegraphdefinitions/status
  verbs:
  - get
  - list
  - watch
